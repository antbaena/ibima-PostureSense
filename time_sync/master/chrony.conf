# === Red / Acceso ===
bindaddress 10.0.0.10
allow 10.0.0.0/24          # sirve NTP solo a tu subred
cmdport 0                  # deshabilita control remoto por red (puerto 323)

# === Reloj de referencia local (LAN aislada) ===
local stratum 10           # autoritativo sin Internet

# === Estabilidad / Arranque ===
makestep 1.0 3             # corrige de golpe si hay >1s al inicio
rtcsync                    # disciplina el RTC
driftfile /var/lib/chrony/chrony.drift

# === Timestamping ===
# Esta máquina NO tiene HW timestamp; lo dejamos y caerá a SW automáticamente.
hwtimestamp *

# === Logs (útil para auditoría) ===
logdir /var/log/chrony
log tracking measurements statistics

# === Autenticación (recomendado) ===
keyfile /etc/chrony.keys
commandkey 1
# En los clientes usaremos "key 1"
