#IMPORTANTE: ELIMINA LOS COMENTARIOS ANTES DE USAR ESTE ARCHIVO
# === Red / Acceso ===
bindaddress 10.0.0.10
allow 10.0.0.0/24          # sirve NTP solo a tu subred

# === Reloj de referencia local (LAN aislada) ===
local stratum 10           # autoritativo sin Internet

# === Estabilidad / Arranque ===
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/chrony.drift

# === Timestamping ===
hwtimestamp *

# === Logs ===
logdir /var/log/chrony
log tracking measurements statistics
